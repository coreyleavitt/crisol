# src/crisol.nim.cfg — RFC-0005 review fix (L1): `-d:ssl` is the DEFAULT for
# the PRODUCED crisol binary (the review found nothing in the build path
# passed it, silently latching every https:// tier's breaker at runtime).
#
# Nim auto-loads a config file named exactly like the compiled PROJECT file
# (here: crisol.nim.cfg beside crisol.nim) whenever that file is the MAIN
# module being compiled — independent of whether the invoker is a bare
# `nim c src/crisol.nim`, `nimble build`/`nimble install` (both shell out to
# plain `nim c ... src/crisol.nim` under the hood), or `./dev build`. This is
# a NIM compiler convention, not a nimble one — verified empirically against
# this project's actual nimble 0.22.2: neither a top-level `switch(...)` call
# in crisol.nimble NOR a `before build`/`before install` hook's `switch(...)`
# call reaches nimble's own build-command compiler invocation (both were
# tried and traced with `nimble build --verbose`; the emitted `nim c` command
# line carried no `-d:ssl` either way). This per-mainfile `.nim.cfg` is the
# one mechanism that actually works, so it's the one used here.
#
# Scope (deliberately narrow): this affects ONLY a compile whose main/project
# file is literally `src/crisol.nim` (the produced CLI binary) — it does NOT
# reach test files (each `nim r` invocation has ITS OWN main file, e.g.
# `tests/unit/test_foo.nim`, so this config is never in that file's own
# directory-or-parents chain) and it does NOT reach a downstream consumer
# that imports an individual `crisol/*` submodule (e.g. `import
# crisol/httpraw`) from their OWN main file: Nim's config-file search walks
# the MAIN file's own directory and its parents, never every directory
# reachable via `--path` (also verified empirically — a `config.nims` placed
# in an imported submodule's own directory, with only its PARENT on
# `--path`, is not loaded). Such a consumer must still pass `-d:ssl` itself
# to get TLS support; nothing short of every such consumer's own build
# accepting the flag can change that.
--define:ssl
