name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      # ci/run-tests.sh, not bare `nimble test`: nimble 0.22.2's custom-task
      # dispatch does not turn a failing task into a nonzero process exit
      # code (see that script's header for the full mechanism, verified
      # against nimble's own source). The script is the only trustworthy
      # exit-code signal — this step is what actually proves it, over the
      # deliberately-failing dummy in tests/meta/.
      - name: Meta-test — assert a failing test fails the harness
        run: |
          if docker run --rm \
              -v "$PWD:/workspace" -w /workspace \
              -e CRISOL_TEST_DIRS=tests/meta \
              -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
              ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh; then
            echo "META-TEST FAILED: harness exited 0 on a failing test"
            exit 1
          else
            echo "META-TEST OK: nonzero exit propagated"
          fi

      - name: Run test suite
        # CRISOL_TIER=ci-linux (rfc-0007 A7): tells the substrate acceptance
        # test (tests/integration/test_rfc0007_a7_substrate_cli.nim) which
        # tier's capabilities() pins to check — GITHUB_ACTIONS itself is a
        # runner-HOST fact, not forwarded into this container by `docker run`
        # unless named explicitly, same convention as CRISOL_TIMING_TESTS/
        # CRISOL_TEST_DIRS below.
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-linux \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

      # RFC-0005 review fix (L1): before this step, NOTHING in CI ever built
      # the actual produced binary — the steps above only compile individual
      # test files, never src/crisol.nim as a whole program — so a regression
      # dropping `-d:ssl` back out of the default build path had no automated
      # gate at all. `src/crisol.nim.cfg` is what now supplies `-d:ssl`
      # automatically whenever `src/crisol.nim` is the compiled main file.
      #
      # Build: compile src/crisol.nim DIRECTLY with the image's on-PATH nim
      # (`/opt/nim/2.2.10-patched`), exactly as ci/run-tests.sh's nimble task
      # does its `nim r --path:src` — deliberately NOT `nimble build`: in a
      # bare `docker run` (HOME=/root, no persisted choosenim state, unlike
      # `./dev`'s mounted .docker-home) nimble 0.22.2's resolver misses the
      # image nim and downloads a vanilla one that ignores this repo's build
      # config. `nim c` loads both the fetch-deps-generated root nim.cfg (dep
      # --paths) and the per-mainfile src/crisol.nim.cfg (-d:ssl). A dedicated
      # .gate-nimcache (never in actions/cache) keeps the compile clean.
      #
      # Gate: assert the PROPERTY, not a compilation artifact. The earlier
      # `strings ./crisol | grep SSL_connect` proxy was fragile — the OpenSSL
      # FFI wrapper's dynlib symbol name is an unreferenced .rodata string
      # that link-time dead-stripping removes in some environments (it stayed
      # in local ld builds, vanished on the CI runner) even for a genuinely
      # -d:ssl binary (CI compiled openssl.nim, which Nim only does under
      # -d:ssl). Instead, RUN the built binary against an https:// remote-cache
      # tier: a -d:ssl build accepts it (config validates; SEC1 emits the
      # "server operator fully trusted" warning), while a build lacking TLS
      # hits the compile-time capability guard and errors "lacks TLS support
      # (-d:ssl)". Absence of that error is the L1 property, directly tested
      # and immune to link/strip differences.
      - name: Build production binary — confirm -d:ssl is the default
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.gate-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash -c '
              set -euo pipefail
              nim c --path:src -o:crisol src/crisol.nim
              printf "remote-cache \"gate\" {\n  url \"https://example.invalid/cache\"\n}\n" > .gate-https.kdl
              out=$(./crisol list --config .gate-https.kdl 2>&1 || true)
              if grep -qi "lacks TLS support" <<<"$out"; then
                echo "L1 REGRESSION: the produced crisol binary rejects an https:// remote-cache tier -- -d:ssl is no longer the default build-path define (see src/crisol.nim.cfg)" >&2
                echo "$out" >&2
                exit 1
              fi
              echo "OK: crisol binary accepts https:// remote-cache tiers (-d:ssl is the default)"
            '

  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      # Serial by design: the timing/rlimits suite (tests/timing/) is
      # deadline- and scheduling-sensitive and flakes under any concurrent
      # host load, this job included — it never shares a runner with `test`.
      # tests/conformance rides along (rfc-0007 A2a-ii): its TIMING-SENSITIVE
      # cases (shared grace window, shutdown wakeup, timeout-kill grace
      # timing) are CRISOL_TIMING_TESTS-gated in-file and only actually run
      # here — the `test` job's leg quits them out at 0 immediately.
      - name: Run timing suite (serial)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e CRISOL_TIMING_TESTS=1 \
            -e CRISOL_TEST_DIRS=tests/timing:tests/conformance \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

  # rfc-0007 A2d — the cross-platform contract spike (N=3 before A2b rebuilds
  # the runner on the contract). No docker here: docker-for-tooling is a
  # Linux pattern (the `test`/`timing` jobs above use a Linux container
  # regardless of runner OS); windows-latest/macos-latest run Nim NATIVELY
  # via jiro4989/setup-nim-action, per this RFC's §1 promise that each
  # backend is "checkable per platform from any host" — the checkABLE part
  # is the `./dev run nim check --os:...` step a contributor runs locally
  # from Linux; these two legs are where it actually EXECUTES.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # ci/fetch-deps.sh needs it; keeps every step's
                       # quoting/globbing uniform (Git Bash ships on
                       # windows-latest runners) instead of mixing in pwsh.
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      # Fast semantic pass first: `nim check` here targets the HOST os
      # (windows-latest IS windows — no --os override needed, unlike the
      # `./dev run nim check --os:windows` cross-check a contributor runs
      # from a Linux checkout). Fails fast with clearer diagnostics before
      # the full compile+link below.
      - name: nim check — process.nim on real Windows
        run: nim check --hints:off --path:src src/crisol/process.nim

      # A2d's acceptance for this leg: COMPILES and the smoke test PASSES —
      # spawn, losslessly observed exit code, and a Job-Object-backed kill.
      # Conformance-green is explicitly NOT required here (RFC-0009 gates
      # that, Stage D) — test_conformance.nim itself imports std/posix
      # unconditionally and would not even compile on this target.
      - name: Compile and run the Windows smoke test
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_smoke.nim

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: nim check — process.nim on real macOS
        run: nim check --hints:off --path:src src/crisol/process.nim

      # The ladder's `macosx` arm maps to process/posix today (C1b is where
      # process/darwin.nim is born) — so this IS the posix backend, proven
      # live on Darwin's kqueue-less poll fallback. Import-purity first
      # (cheap, catches a suite-wide mistake before the real cases run);
      # then the non-timing conformance cases — the POLL-FALLBACK subset
      # the A2d bullet asks for. test_conformance_timing.nim is
      # deliberately NOT invoked here: it's CRISOL_TIMING_TESTS-gated and
      # wall-clock-sensitive, out of scope for this leg's acceptance.
      - name: Conformance suite — import purity
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_conformance_import_purity.nim

      - name: Conformance suite — non-timing cases (poll fallback)
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_conformance.nim
