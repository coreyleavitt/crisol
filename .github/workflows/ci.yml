name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      # ci/run-tests.sh, not bare `nimble test`: nimble 0.22.2's custom-task
      # dispatch does not turn a failing task into a nonzero process exit
      # code (see that script's header for the full mechanism, verified
      # against nimble's own source). The script is the only trustworthy
      # exit-code signal — this step is what actually proves it, over the
      # deliberately-failing dummy in tests/meta/.
      - name: Meta-test — assert a failing test fails the harness
        run: |
          if docker run --rm \
              -v "$PWD:/workspace" -w /workspace \
              -e CRISOL_TEST_DIRS=tests/meta \
              -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
              ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh; then
            echo "META-TEST FAILED: harness exited 0 on a failing test"
            exit 1
          else
            echo "META-TEST OK: nonzero exit propagated"
          fi

      - name: Run test suite
        # CRISOL_TIER=ci-linux (rfc-0007 A7): tells the substrate acceptance
        # test (tests/integration/test_rfc0007_a7_substrate_cli.nim) which
        # tier's capabilities() pins to check — GITHUB_ACTIONS itself is a
        # runner-HOST fact, not forwarded into this container by `docker run`
        # unless named explicitly, same convention as CRISOL_TIMING_TESTS/
        # CRISOL_TEST_DIRS below.
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-linux \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

      # rfc-0007 B2: `next()` is event-driven (pidfd+epoll+timerfd) on this
      # runner by default (Linux + a real pidfd probe) — CRISOL_FORCE_POLL
      # forces the poll(2) fallback path instead, so the checklist's "green
      # under both epoll and poll, forced via an env knob in tests"
      # requirement (item 544) is proven every run, not just asserted. Only
      # tests/conformance needs a second pass: it is the one suite that
      # actually exercises `next()`'s backend selection
      # (posixcore.initPosixCore); every other suite above already ran and
      # is agnostic to which tier is live underneath.
      - name: Run conformance suite forced onto the poll(2) fallback path
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-linux \
            -e CRISOL_FORCE_POLL=1 \
            -e CRISOL_TEST_DIRS=tests/conformance \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

      # RFC-0009 A3b-ii (round-3, R3-18.2): CRISOL_FOLD_POLICY is REQUIRED
      # for this slice -- the load-bearing E2E body (a real git repo, a
      # committed case-only rename of a transitively-imported dependency,
      # `--changed` selection through the real `buildRunPlan` shared plan
      # phase) must run green on this genuinely case-sensitive ext4 runner,
      # forced onto fpAsciiLower, BEFORE the windows/macos legs (mode 2,
      # the real probe) are trusted to carry the rest of the claim. Single
      # file, not a `CRISOL_TEST_DIRS` sweep -- this is the one test this
      # gate exists for.
      - name: rfc-0009 A3b-ii — fold-membership selection (forced fpAsciiLower)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_FOLD_POLICY=fpAsciiLower \
            ghcr.io/coreyleavitt/nim:2.2.10 \
            nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a3bii_fold_selection.nim

      # RFC-0005 review fix (L1): before this step, NOTHING in CI ever built
      # the actual produced binary — the steps above only compile individual
      # test files, never src/crisol.nim as a whole program — so a regression
      # dropping `-d:ssl` back out of the default build path had no automated
      # gate at all. `src/crisol.nim.cfg` is what now supplies `-d:ssl`
      # automatically whenever `src/crisol.nim` is the compiled main file.
      #
      # Build: compile src/crisol.nim DIRECTLY with the image's on-PATH nim
      # (`/opt/nim/2.2.10-patched`), exactly as ci/run-tests.sh's nimble task
      # does its `nim r --path:src` — deliberately NOT `nimble build`: in a
      # bare `docker run` (HOME=/root, no persisted choosenim state, unlike
      # `./dev`'s mounted .docker-home) nimble 0.22.2's resolver misses the
      # image nim and downloads a vanilla one that ignores this repo's build
      # config. `nim c` loads both the fetch-deps-generated root nim.cfg (dep
      # --paths) and the per-mainfile src/crisol.nim.cfg (-d:ssl). A dedicated
      # .gate-nimcache (never in actions/cache) keeps the compile clean.
      #
      # Gate: assert the PROPERTY, not a compilation artifact. The earlier
      # `strings ./crisol | grep SSL_connect` proxy was fragile — the OpenSSL
      # FFI wrapper's dynlib symbol name is an unreferenced .rodata string
      # that link-time dead-stripping removes in some environments (it stayed
      # in local ld builds, vanished on the CI runner) even for a genuinely
      # -d:ssl binary (CI compiled openssl.nim, which Nim only does under
      # -d:ssl). Instead, RUN the built binary against an https:// remote-cache
      # tier: a -d:ssl build accepts it (config validates; SEC1 emits the
      # "server operator fully trusted" warning), while a build lacking TLS
      # hits the compile-time capability guard and errors "lacks TLS support
      # (-d:ssl)". Absence of that error is the L1 property, directly tested
      # and immune to link/strip differences.
      - name: Build production binary — confirm -d:ssl is the default
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.gate-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash -c '
              set -euo pipefail
              nim c --path:src -o:crisol src/crisol.nim
              printf "remote-cache \"gate\" {\n  url \"https://example.invalid/cache\"\n}\n" > .gate-https.kdl
              out=$(./crisol list --config .gate-https.kdl 2>&1 || true)
              if grep -qi "lacks TLS support" <<<"$out"; then
                echo "L1 REGRESSION: the produced crisol binary rejects an https:// remote-cache tier -- -d:ssl is no longer the default build-path define (see src/crisol.nim.cfg)" >&2
                echo "$out" >&2
                exit 1
              fi
              echo "OK: crisol binary accepts https:// remote-cache tiers (-d:ssl is the default)"
            '

  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      # Serial by design: the timing/rlimits suite (tests/timing/) is
      # deadline- and scheduling-sensitive and flakes under any concurrent
      # host load, this job included — it never shares a runner with `test`.
      # tests/conformance rides along (rfc-0007 A2a-ii): its TIMING-SENSITIVE
      # cases (shared grace window, shutdown wakeup, timeout-kill grace
      # timing) are CRISOL_TIMING_TESTS-gated in-file and only actually run
      # here — the `test` job's leg quits them out at 0 immediately.
      - name: Run timing suite (serial)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e CRISOL_TIMING_TESTS=1 \
            -e CRISOL_TEST_DIRS=tests/timing:tests/conformance \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

  # rfc-0007 B3 — the leg-first cgroup-v2 delegation canary. `test`/`timing`
  # above run a plain `docker run` (no --privileged): the container's own
  # cgroup is a regular, non-root cgroup handed to it by dockerd with an
  # empty cgroup.subtree_control, so capabilities().cgroupDelegation is
  # honestly false there (asserted by checkTierPins' ci-linux branch) — B3
  # needs a leg where delegation is REALLY present, not asserted from a
  # no-op probe (the #12 lesson).
  #
  # Approach chosen: `docker run --privileged` on the GH-hosted runner, NOT
  # a bare sudo-delegated subtree on the runner host directly. Both were
  # tried empirically (against a real cgroup-v2 host, not just read from
  # docs) before landing here:
  #   - Bare host subtree: the runner's login/job shell already sits deep in
  #     a systemd-managed hierarchy (session/job scope) that it does not own
  #     (cgroup.subtree_control there is root:root, not chown'd to the
  #     runner uid) — every write needs `sudo` per-call, and the shell
  #     process itself is a standing occupant of whatever scope holds it,
  #     which collides with the very constraint below.
  #   - `--privileged` container: dockerd hands the container a writable,
  #     freshly-rooted cgroup-v2 view (0::/) with full delegation once the
  #     no-internal-process topology (next paragraph) is set up inside it —
  #     no per-call sudo, no pre-existing occupants to work around.
  #
  # The topology, and why it's shaped this way (verified empirically, not
  # assumed from docs): cgroup v2's "no internal process constraint" means a
  # cgroup can NEVER hold a resident process at the same time as it enables
  # controllers in its OWN cgroup.subtree_control — attempting either while
  # the other holds fails with EBUSY. Concretely this means the container's
  # entrypoint shell (which starts AT the container's cgroup root) must
  # vacate the root before the root can delegate anything:
  #   1. mkdir a throwaway leaf, move the entrypoint shell into it — root is
  #      now unoccupied.
  #   2. NOW enable +cpu +memory +pids on the (unoccupied) root's
  #      subtree_control.
  #   3. mkdir the real runner leaf (a CHILD of root, i.e. a SIBLING of the
  #      throwaway leaf) and move the shell there. Because root's
  #      subtree_control already carries +memory, the runner leaf gets
  #      real memory.peak/memory.max/cgroup.kill files on itself immediately
  #      — this is the exact shape `probeCgroupV2` (posixcore.nim) now
  #      checks (a SIBLING of the calling process's own cgroup, never a
  #      CHILD of it — a child-of-self leaf can never get the memory
  #      controller, structurally, no matter the environment, since the
  #      calling process's own cgroup can never delegate to its own child
  #      while occupied by that same process; see that proc's comment).
  # Every child process forked afterward (the whole nimble test run) stays
  # in the runner leaf by ordinary cgroup inheritance, so the crisol test
  # binary itself is the process `probeCgroupV2` actually walks.
  #
  # CRISOL_TIER=ci-cgroup pins the acceptance in
  # tests/integration/test_rfc0007_a7_substrate_cli.nim to
  # cgroupDelegation/cgroupKill/memoryPeak all true — an inert probe (or a
  # regressed one) fails HERE, not silently, the first time B3's backend
  # tries to consume it.
  cgroup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      - name: Establish real cgroup-v2 delegation and run the test suite inside it
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-cgroup \
            ghcr.io/coreyleavitt/nim:2.2.10 bash -c '
              set -euo pipefail
              echo "--- before delegation ---"
              cat /proc/self/cgroup
              cat /sys/fs/cgroup/cgroup.controllers

              mkdir -p /sys/fs/cgroup/crisol-init
              echo $$ > /sys/fs/cgroup/crisol-init/cgroup.procs

              echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control

              mkdir -p /sys/fs/cgroup/crisol-runner
              echo $$ > /sys/fs/cgroup/crisol-runner/cgroup.procs

              echo "--- after delegation ---"
              cat /proc/self/cgroup
              test -f /sys/fs/cgroup/crisol-runner/memory.peak || {
                echo "SETUP FAILED: runner leaf has no memory.peak -- delegation was not actually established" >&2
                exit 1
              }
              test -f /sys/fs/cgroup/crisol-runner/cgroup.kill || {
                echo "SETUP FAILED: runner leaf has no cgroup.kill" >&2
                exit 1
              }
              echo "delegation established: runner leaf has memory.peak and cgroup.kill"

              bash ci/run-tests.sh
            '

  # rfc-0007 A2d — the cross-platform contract spike (N=3 before A2b rebuilds
  # the runner on the contract). No docker here: docker-for-tooling is a
  # Linux pattern (the `test`/`timing` jobs above use a Linux container
  # regardless of runner OS); windows-latest/macos-latest run Nim NATIVELY
  # from the same patched-toolchain artifact channel (ghcr.io/coreyleavitt/
  # nim OCI artifacts, fetched by ci/fetch-nim-toolchain.sh; windows uses
  # the MSVC backend), per this RFC's §1 promise that each
  # backend is "checkable per platform from any host" — the checkABLE part
  # is the `./dev run nim check --os:...` step a contributor runs locally
  # from Linux; these two legs are where it actually EXECUTES.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash   # ci/fetch-deps.sh needs it; keeps every step's
                       # quoting/globbing uniform (Git Bash ships on
                       # windows-latest runners) instead of mixing in pwsh.
    steps:
      - uses: actions/checkout@v4

      # Patched-toolchain parity with the Linux legs (which run inside
      # ghcr.io/coreyleavitt/nim:2.2.10): this leg previously installed
      # STOCK upstream 2.2.10 via setup-nim-action, silently dropping the
      # backport patch set (incl. the 26017 bigchunk-freelist and 26110
      # memregion allocator fixes) and running the mingw/gcc backend. Now
      # it pulls the native toolchain artifact and compiles with MSVC:
      # cc = vcc is appended to the toolchain's own config so crisol's
      # CHILD nim compiles (the runner spawns nim per entrypoint) inherit
      # it too, not just the top-level suite builds; vccexe.exe ships in
      # the artifact and resolves cl.exe via vswhere on windows-latest.
      - name: Install patched Nim toolchain (MSVC)
        run: |
          BIN=$(bash ci/fetch-nim-toolchain.sh 2.2.10-windows-x64 "$RUNNER_TEMP/nimtc" | tail -1)
          printf '\n@if windows:\n  cc = vcc\n@end\n' >> "$(dirname "$BIN")/config/nim.cfg"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Toolchain sanity (patched build, vcc backend)
        run: |
          nim --version
          nim --version 2>&1 | grep -qi "2.2.10" || { echo "wrong nim version" >&2; exit 1; }

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      # Fast semantic pass first: `nim check` here targets the HOST os
      # (windows-latest IS windows — no --os override needed, unlike the
      # `./dev run nim check --os:windows` cross-check a contributor runs
      # from a Linux checkout). Fails fast with clearer diagnostics before
      # the full compile+link below.
      - name: nim check — process.nim on real Windows
        run: nim check --hints:off --path:src src/crisol/process.nim

      # A2d's acceptance for this leg (historical): COMPILES and the smoke test
      # PASSES — spawn, losslessly observed exit code, and a Job-Object-backed
      # kill. Since then RFC-0009 Stage B de-POSIX'd the suite and the B4b step
      # below widened this leg to the full tests/unit:tests/conformance sweep;
      # test_conformance.nim no longer imports std/posix (B3a-ii) and compiles
      # here, but it is the POSIX process-backend conformance suite, so it
      # self-skips `when not defined(posix)` on windows (that backend is proven
      # by the per-file test_windows_* steps in this job). This smoke step is
      # kept as the fast early spawn/kill check ahead of the fuller sweep.
      - name: Compile and run the Windows smoke test
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_smoke.nim

      # rfc-0007 D1a — the four load-bearing pieces, each with its own
      # narrowly-scoped conformance file (mirrors the smoke test above, not
      # test_conformance.nim's std/posix-importing full suite): the
      # ekNtStatus producer proof (access-violation fixture), snapshotTree
      # forensics, the completion-port `next` tier, and inherited-handle
      # sink delivery. "Conformance SMOKE green" per the D1a bullet — full
      # windows-suite parity remains RFC-0009's acceptance, not this leg's.
      - name: D1a — ekNtStatus producer proof (access violation)
        if: always()   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_ntstatus.nim

      - name: D1a — snapshotTree forensics
        if: always()   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_forensics.nim

      - name: D1a — completion-port next (IOCP)
        if: always()   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_iocp.nim

      - name: D1a — inherited handles to sinks
        if: always()   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_sinks.nim

      - name: rfc-0007 D1b — windows cooperative stop / cooperativeUnavailable
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_coopstop.nim

      - name: rfc-0007 D1b — windows Job limits (cpu/address-space)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_limits.nim

      - name: rfc-0007 D1b — windows containment / ppid forensics
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_containment.nim

      - name: rfc-0007 D2a — windows memprobe groupRssBytes + shutdown getter
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_memprobe.nim

      - name: rfc-0007 D2a — windows advisory lock (LockFileEx)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_lock.nim

      - name: rfc-0007 D2a — windows availableMemBytes (GlobalMemoryStatusEx)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_availmem.nim

      - name: rfc-0007 D2a-5 — windows socket timeouts (winsock DWORD-ms)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_httptimeout.nim

      - name: rfc-0007 D2a-4 — windows ioutils (CRT int-fd backend)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_ioutils.nim

      - name: rfc-0007 D2a — crisol CLI compiles on windows
        if: always()
        run: nim c --hints:off --warnings:off --path:src -o:crisol_win_smoke src/crisol.nim

      - name: rfc-0007 D2a-6 — windows CLI liveness (crisol run --json)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_cli_smoke.nim

      - name: A0-spike — import-case manifest observation
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_spike_import_case.nim

      - name: rfc-0009 A1 — fold-probe real-volume runtime evidence
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_fold_probe.nim

      # RFC-0009 A3b-ii (round-3, R3-18.4): the load-bearing E2E test, real
      # probe (no injection) -- hard-asserts the NTFS volume answers
      # fpAsciiLower (both directly and via this run's own RunReport
      # evidence) before proving selection: a real git repo, a committed
      # case-only rename of a transitively-imported dependency, `--changed`
      # selection through the real `buildRunPlan` shared plan phase. This is
      # the windows leg's producer for the NTFS half of the load-bearing
      # property -- a pinned per-file step, not a conformance sweep, so
      # without it the property has no producer here until B4b.
      - name: rfc-0009 A3b-ii — fold-membership selection (real NTFS probe)
        if: always()
        env:
          CRISOL_EXPECT_FOLD: fpAsciiLower
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a3bii_fold_selection.nim

      # RFC-0009 A4b (D5): the load-bearing on-disk-case determinism
      # property, cold vs warm -- a real git-free compile through
      # runner.plan/execute (two entrypoints, divergent importer case,
      # one real on-disk dependency). Self-probes this volume's case-
      # sensitivity (no env injection, same convention as the A0-spike
      # step above) -- NTFS is case-insensitive, so this is a real
      # producer here, not a skip. A pinned per-file step, not a
      # conformance sweep, mirroring the A3b-ii step immediately above.
      - name: rfc-0009 A4b — closure member on-disk-case determinism (real NTFS probe)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a4b_determinism.nim

      # RFC-0009 A5c: the cache-portability E2E — a depRoot closure member's
      # cache key must be host-portable (relocating the project tree between
      # two runs still HITS the local cache). Fold-INDEPENDENT (no
      # CRISOL_EXPECT_FOLD, no volume-skip guard) — this is a producer here
      # regardless of NTFS case policy, mirroring the A3b-ii/A4b per-file
      # steps immediately above. Self-skips only on an environment that
      # cannot create symlinks at all (same convention as
      # test_closure_a4a.nim), never on case (in)sensitivity.
      - name: rfc-0009 A5c — cache-portability E2E (depRoot member, relocated tree)
        if: always()
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a5c_cache_portability.nim

      # RFC-0009 wiring-audit F16 (TIER A unlock attempt): enable Windows'
      # long-path registry key before the suite step below runs
      # test_rfc9_w2_longpath_e2e.nim. Harmless either way — this only
      # widens what Win32 itself permits; it does not by itself make any
      # given process long-path-aware. IF this runner's nim.exe binary
      # manifest also declares longPathAware, this can unlock that test's
      # TIER A (full compile-through proof) instead of its documented TIER
      # B graceful-degradation fallback; empirically (CI run 35315917270,
      # before this step existed) nim.exe's own file opens were not
      # long-path-aware regardless of this OS-level switch, so TIER B is
      # the realistic near-term outcome — but the test's own adaptive tier
      # selection (see its header doc comment) handles either outcome
      # honestly, so this step is pure upside. `shell: pwsh` overrides this
      # job's default `bash` (Git Bash cannot run a PowerShell cmdlet):
      # `Set-ItemProperty` is PowerShell-only; pwsh ships on windows-latest
      # runners alongside Git Bash.
      - name: rfc-0009 F16 — enable Windows LongPathsEnabled registry key
        shell: pwsh
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      # RFC-0009 B4b — COMPLETION GATE: widen the windows leg's scope from
      # B4a's tests/unit-only bring-up to tests/unit:tests/conformance, still
      # native, still through the SAME honest-exit wrapper the Linux/macOS
      # legs use (ci/run-tests.sh -> nimble test -> per-file `nim r`). This is
      # the first time the general (non-windows-specific) conformance suite
      # compiles AND runs natively here alongside the unit suite: every
      # POSIX-backend test is gated `when defined(posix)` (B1/B2/B3a/B3b/B3c)
      # so it skips BY DESIGN, while the portable majority — including the
      # load-bearing identity conformance tests (A3b-ii, A4b, A5c) — runs for
      # real. Explicitly OUT of scope for this leg (mirroring the macos-latest
      # leg's own long-standing unit+conformance-only scope, below):
      # tests/integration (heavier process-spawning CLI coverage — Linux/
      # macOS only), tests/timing (the dedicated serial timing job covers
      # this), and tests/fixtures (these compile as CHILD PROGRAMS spawned
      # BY tests/integration cases via compileFixture — they are never
      # discovered by the harness's own test_*.nim sweep and never invoked at
      # all when their driving integration test is itself posix-gated).
      #
      # SUBSET-HONESTY (RFC-0009 round-3 R3-19): ci/assert-subset-honesty.sh
      # asserts, BY NAME not count, that the exact expected set of gated files
      # skipped (and no other), and that the three identity conformance tests
      # ran their REAL body, not a self-skip. `set -o pipefail` +
      # `${PIPESTATUS[0]}` preserve run-tests.sh's own honest exit code
      # through the `tee` — a suite failure must never be masked by a
      # passing (or even a failing) assertion step layered on top of it.
      - name: rfc-0009 B4b — unit + conformance suite (native, ci/run-tests.sh)
        env:
          CRISOL_TEST_DIRS: tests/unit:tests/conformance
        run: |
          set -o pipefail
          bash ci/run-tests.sh 2>&1 | tee harness.log
          suite_status=${PIPESTATUS[0]}
          bash ci/assert-subset-honesty.sh harness.log windows
          honesty_status=$?
          if [ "$suite_status" -ne 0 ]; then
            echo "rfc-0009 B4b: harness suite FAILED (exit $suite_status) -- see output above" >&2
            exit "$suite_status"
          fi
          if [ "$honesty_status" -ne 0 ]; then
            echo "rfc-0009 B4b: subset-honesty assertion FAILED (exit $honesty_status)" >&2
            exit "$honesty_status"
          fi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Patched-toolchain parity with the Linux legs -- see the windows
      # leg's comment; same artifact channel, arm64 payload (macos-latest
      # runners are Apple Silicon), clang backend as before.
      - name: Install patched Nim toolchain
        run: |
          BIN=$(bash ci/fetch-nim-toolchain.sh 2.2.10-macos-arm64 "$RUNNER_TEMP/nimtc" | tail -1)
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: nim check — process.nim on real macOS
        run: nim check --hints:off --path:src src/crisol/process.nim

      # Cheap pre-check: a suite-wide import mistake fails here before the
      # slower full compile+run below pays the per-file `nim r` cost.
      - name: Conformance suite — import purity (fast pre-check)
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_conformance_import_purity.nim

      # rfc-0007 C1b: the ladder's `macosx` arm now maps to process/darwin —
      # kqueue EVFILT_PROC event-driven `next` + libproc process-table
      # forensics, not the poll(2)/`/proc`-shaped fallback C1a proved this
      # leg on. This proves the FULL unit + conformance suites, not just an
      # import-purity/single-file spot check, live on Darwin's real backend.
      # Same honest-exit wrapper the Linux legs use (`ci/run-tests.sh` ->
      # `nimble test`, see that script's header for why the wrapper exists)
      # — no docker here, windows/macos run Nim natively (A2d).
      # CRISOL_TIER=macos tells test_process_capabilities.nim's tier-pinned
      # acceptance suite which tier's honest capability values to assert
      # (subreaper/pidfd/cgroupDelegation false, kqueue/flock/wait4Rusage
      # true — kqueue real since C1b, the rest real POSIX on Darwin).
      #
      # tests/integration is deliberately excluded (CRISOL_TEST_DIRS pins
      # unit+conformance only) — heavier process-spawning integration
      # coverage on Darwin is out of scope for this slice. Conformance's
      # own TIMING-SENSITIVE cases stay inert here: they self-gate on
      # CRISOL_TIMING_TESTS (unset in this step), same convention as every
      # other leg — the step below turns them on for this leg specifically.
      # RFC-0009 B4b — SUBSET-HONESTY covers this leg too (not just windows):
      # ci/assert-subset-honesty.sh asserts, BY NAME, that nothing in the
      # B2/B3b gated set skips here (macOS/Darwin IS posix, so every
      # `when defined(posix)` gate takes its real branch -- the expected-skip
      # set for "macos" is empty) and that the three identity conformance
      # tests (A3b-ii, A4b, A5c) ran their real body. Same pipefail +
      # PIPESTATUS discipline as the windows leg: run-tests.sh's own honest
      # exit code must never be masked by `tee` or by the assertion step.
      - name: Run unit + conformance suites (kqueue/libproc backend)
        env:
          CRISOL_TIER: macos
          CRISOL_TEST_DIRS: tests/unit:tests/conformance
          # RFC-0009 A3b-ii (round-3, R3-18.4): hard-asserts the real probe
          # on this leg's APFS volume before proving fold-membership
          # selection live (test_rfc9_a3bii_fold_selection.nim, swept in via
          # CRISOL_TEST_DIRS above) -- a leg mis-pinned to the wrong policy
          # fails loudly instead of silently halving the "proven on two
          # case-insensitive legs" claim.
          #
          # RFC-0009 A4b (D5): test_rfc9_a4b_determinism.nim (also under
          # tests/conformance/) is swept in here the SAME way -- it
          # self-probes this volume's case-sensitivity (no env needed) and
          # is a real producer on APFS, mirroring how it gets a dedicated
          # per-file step on the windows job (which runs conformance files
          # individually rather than via CRISOL_TEST_DIRS sweep).
          CRISOL_EXPECT_FOLD: fpAsciiLower
        run: |
          set -o pipefail
          bash ci/run-tests.sh 2>&1 | tee harness.log
          suite_status=${PIPESTATUS[0]}
          bash ci/assert-subset-honesty.sh harness.log macos
          honesty_status=$?
          if [ "$suite_status" -ne 0 ]; then
            echo "rfc-0009 B4b: harness suite FAILED (exit $suite_status) -- see output above" >&2
            exit "$suite_status"
          fi
          if [ "$honesty_status" -ne 0 ]; then
            echo "rfc-0009 B4b: subset-honesty assertion FAILED (exit $honesty_status)" >&2
            exit "$honesty_status"
          fi

      # rfc-0007 C1b: tests/conformance's TIMING-SENSITIVE cases (self-gated
      # on CRISOL_TIMING_TESTS, unset in the step above) include this
      # slice's kqueue latency proof (test_conformance_timing.nim's C1b
      # suite) alongside the existing B2 Linux-mirrored case — the ONLY leg
      # where the C1b suite actually compiles and runs (`when
      # defined(macosx):`-gated). tests/timing/ itself is NOT included here
      # (unlike the Linux `timing` job): several of its files exercise
      # Linux-only subreaper mechanism this leg's Supervisor never enables
      # (caps.subreaper is honestly false on Darwin) — out of scope for this
      # slice, not a gap this step is meant to cover.
      - name: Run conformance suite with timing enabled (kqueue latency proof)
        env:
          CRISOL_TIER: macos
          CRISOL_TIMING_TESTS: 1
          CRISOL_TEST_DIRS: tests/conformance
        run: bash ci/run-tests.sh
