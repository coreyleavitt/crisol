name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # R8-D2: no job used to set a timeout, so a wedged step ran to GitHub's
    # 360-minute default. Typical wall time here is ~35 min (runs
    # 35491097764/35486328581); roughly 2.5x that, so a slow runner never
    # trips it but a hang cannot hold the runner for six hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # R5-15: the defaulted-soundness-parameter census, pinned as an exact set.
      # R2-7 named the class -- a parameter that governs correctness carrying a
      # convenient default, so omitting it silently yields the unsound value and
      # is invisible in review -- and R3-7/R4-4 fixed the known population one
      # proc at a time. R5-15 found one the population had missed
      # (artifactid.artifactKeyHash) and, more importantly, that the prescribed
      # remedy was a grep a reviewer runs by hand. This step is that census as a
      # machine check: every defaulted parameter under src/ is either in the
      # allowlist with a one-line reason, or this step fails.
      #
      # It fails in BOTH directions, like ci/assert-subset-honesty.sh: a new
      # unclassified parameter AND a stale pin. Exit 1 is drift; exit 2 is a
      # broken enumerator -- notably zero signatures found, which it refuses to
      # report as a clean tree.
      #
      # FIRST step in the job, before Fetch vendored deps: no Nim, no network, no
      # dependencies, source text only, seconds. A source-text census is not
      # platform-dependent, so it runs on this leg only.
      #
      # R7-L2, corrected by R8-D2: FIRST, but not a gate on the rest of the
      # job. The census, the soundness gate, the meta-test and the suites are
      # independent verdicts, and a red census must not hide whether the suite
      # is also red (the same "surface every issue per run" rule the windows
      # leg states on its D1a steps). So the steps below run after an
      # UNRELATED red step, but on two conditions R7-L2's `if: always()` did
      # not state:
      #   - `!cancelled()`, never `always()`: a PR run superseded by a newer
      #     push (cancel-in-progress, top of file) stops instead of grinding
      #     through every remaining step. GitHub's own guidance: always() is
      #     for steps that must run even on cancellation, which none of these
      #     are.
      #   - every step that needs the vendored deps is gated on
      #     `steps.deps.outcome == 'success'`, so a failed fetch fails ONCE,
      #     not once more per step as a missing-module error. Fetch vendored
      #     deps and the cache restore themselves need nothing before them, so
      #     they carry `!cancelled()` alone.
      # The self-test is the one exception -- it needs a green census (see its
      # comment), so it keeps the default success() gate.
      - name: Defaulted-parameter census (src/)
        run: bash ci/assert-defaulted-params.sh

      # R6-S2/R6-D2: the census is itself a parser (a depth walk over Nim
      # signatures that must see past string literals and comments), and a
      # parser that goes quietly blind looks exactly like a clean tree. This
      # step mutation-tests the census script on temp copies of src/ -- never
      # the working tree: parens/# inside string, raw, triple and char literals
      # and block comments; flipped default values; a signature, triple string
      # or block comment left open at EOF (exit 2, cannot tell); and a new and a
      # removed defaulted parameter. It needs a green census, so it runs right
      # after it. Same budget: bash, mktemp, sed, grep, awk -- seconds.
      - name: Defaulted-parameter census self-test
        run: bash ci/assert-defaulted-params.selftest.sh

      # R12-D9: ci/assert-subset-honesty.sh (run by the windows and macos
      # legs) parses this file's windows and macos jobs and fails when a
      # per-file `nim r tests/<x>.nim | tee -a harness.log` step has no
      # require_per_file block, or a block names a file with no step. This
      # mutation-tests that check on temp copies of this file and of the
      # script -- a new step, a deleted step, a step that stops appending, a
      # deleted block, a step in the other leg's or an unrelated job, a
      # comment, an unrecognised harness.log writer, a renamed job. The logs it
      # judges are built from the script's own failure output, so it needs no
      # CI log. Source text only, like the census: bash, awk, sed, comm --
      # seconds, and this leg alone. It needs nothing before it, so it carries
      # `!cancelled()` alone.
      - name: Subset-honesty per-file drift self-test
        if: ${{ !cancelled() }}
        run: bash ci/assert-subset-honesty.selftest.sh

      - name: Fetch vendored deps (milpa.lock)
        id: deps
        if: ${{ !cancelled() }}
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      # R4-3 / R4-6: the ONLY automated producer for the two source-level
      # soundness gates. Before this step nothing in CI ran either flag -- every
      # test compile goes through crisol.nimble's `nim r --hints:off
      # --warnings:off --path:src`, which silences both, and the -d:ssl build
      # gate at the end of this job emits them as plain Warnings nothing greps
      # for. `./dev check` on its own is a host-side habit, not an enforcement
      # point. This job is the right home: it is the only leg with no
      # CRISOL_TEST_DIRS restriction.
      #
      # The gate itself -- both --warningAsError flags, every invocation, all
      # three --os targets, and the `{.push warning[Deprecated]: off.}` remedy
      # for an export line that starts failing it -- lives in
      # ci/source-soundness-gate.sh, ONE copy shared with `./dev check`
      # (R5-11). Deliberately no second copy of that prose here.
      #
      # That script also asserts its OWN coverage (R5-11, round 5): its three
      # aggregator passes run through codegen with -d:nimBetterRun, and
      # ci/assert-gate-coverage.py reads the resulting depfiles manifests and
      # exits non-zero if any .nim file under src/ is compiled by no pass. So a
      # new module that lands outside every target's import closure fails this
      # step instead of being silently ungated. It needs python3, present in this
      # image, and REFUSES to report success without it -- a coverage check that
      # skips itself is the darkness class ci/assert-subset-honesty.sh audits for.
      #
      # It runs on the LINUX leg only, cross-targeting windows and macosx from
      # here (`nim check` never invokes a C compiler, so it needs no cross
      # toolchain). The windows/macos legs' own `nim check` steps stay as they
      # are: one job that can see all three targets is cheaper than three
      # partial gates, and keeps the gate in a single place to read.
      #
      # `nim check` in a container directly, never `./dev check`: `dev` drives
      # podman from a host shell, and this job already runs inside its own
      # container.
      - name: Source soundness gate — zero deprecations, zero unused imports in src/ (linux + windows + macosx)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/source-soundness-gate.sh

      # ci/run-tests.sh, not bare `nimble test`: nimble 0.22.2's custom-task
      # dispatch does not turn a failing task into a nonzero process exit
      # code (see that script's header for the full mechanism, verified
      # against nimble's own source). The script is the only trustworthy
      # exit-code signal — this step is what actually proves it, over the
      # deliberately-failing dummy in tests/meta/.
      #
      # R8-S5: a nonzero exit alone proves nothing -- a failed deps fetch, a
      # docker pull failure or a crisol.nimble that no longer parses all exit
      # nonzero too, and R7-L2's `if: always()` let this step run after
      # exactly those and print "META-TEST OK". So it now (a) runs only when
      # the deps fetch succeeded, and (b) requires the SPECIFIC failure it
      # exists to observe: the dummy's own doAssert message, and the nimble
      # task's verdict naming that one file as the failure. Anything else is
      # "the harness failed for a different reason", which is a META-TEST
      # failure, not a pass.
      - name: Meta-test — assert a failing test fails the harness
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e CRISOL_TEST_DIRS=tests/meta \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh > "$RUNNER_TEMP/meta.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/meta.log"
          if [ "$status" -eq 0 ]; then
            echo "META-TEST FAILED: harness exited 0 on a failing test" >&2
            exit 1
          fi
          if ! grep -qF "deliberate failure: CI meta-test asserting nonzero exit propagates" "$RUNNER_TEMP/meta.log" ||
             ! grep -qF "FAILED: 1 file(s)" "$RUNNER_TEMP/meta.log" ||
             ! grep -qE '^  tests/meta/test_fail_dummy\.nim$' "$RUNNER_TEMP/meta.log"; then
            echo "META-TEST FAILED: harness exited $status, but not because of the dummy -- its doAssert message or the task's 'FAILED: 1 file(s)' / 'tests/meta/test_fail_dummy.nim' verdict is missing (see output above)" >&2
            exit 1
          fi
          echo "META-TEST OK: the dummy's failure propagated as exit $status"

      - name: Run test suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        # CRISOL_TIER=ci-linux (rfc-0007 A7): tells the substrate acceptance
        # test (tests/integration/test_rfc0007_a7_substrate_cli.nim) which
        # tier's capabilities() pins to check — GITHUB_ACTIONS itself is a
        # runner-HOST fact, not forwarded into this container by `docker run`
        # unless named explicitly, same convention as CRISOL_TIMING_TESTS/
        # CRISOL_TEST_DIRS below.
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-linux \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

      # rfc-0007 B2: `next()` is event-driven (pidfd+epoll+timerfd) on this
      # runner by default (Linux + a real pidfd probe) — CRISOL_FORCE_POLL
      # forces the poll(2) fallback path instead, so the checklist's "green
      # under both epoll and poll, forced via an env knob in tests"
      # requirement (item 544) is proven every run, not just asserted. Only
      # tests/conformance needs a second pass: it is the one suite that
      # actually exercises `next()`'s backend selection
      # (posixcore.initPosixCore); every other suite above already ran and
      # is agnostic to which tier is live underneath.
      - name: Run conformance suite forced onto the poll(2) fallback path
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-linux \
            -e CRISOL_FORCE_POLL=1 \
            -e CRISOL_TEST_DIRS=tests/conformance \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

      # RFC-0009 A3b-ii (round-3, R3-18.2): CRISOL_FOLD_POLICY is REQUIRED
      # for this slice -- the load-bearing E2E body (a real git repo, a
      # committed case-only rename of a transitively-imported dependency,
      # `--changed` selection through the real `buildRunPlan` shared plan
      # phase) must run green on this genuinely case-sensitive ext4 runner,
      # forced onto fpAsciiLower, BEFORE the windows/macos legs (mode 2,
      # the real probe) are trusted to carry the rest of the claim. Single
      # file, not a `CRISOL_TEST_DIRS` sweep -- this is the one test this
      # gate exists for.
      - name: rfc-0009 A3b-ii — fold-membership selection (forced fpAsciiLower)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_FOLD_POLICY=fpAsciiLower \
            ghcr.io/coreyleavitt/nim:2.2.10 \
            nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a3bii_fold_selection.nim

      # RFC-0005 review fix (L1): before this step, NOTHING in CI ever built
      # the actual produced binary — the steps above only compile individual
      # test files, never src/crisol.nim as a whole program — so a regression
      # dropping `-d:ssl` back out of the default build path had no automated
      # gate at all. `src/crisol.nim.cfg` is what now supplies `-d:ssl`
      # automatically whenever `src/crisol.nim` is the compiled main file.
      #
      # Build: compile src/crisol.nim DIRECTLY with the image's on-PATH nim
      # (`/opt/nim/2.2.10-patched`), exactly as ci/run-tests.sh's nimble task
      # does its `nim r --path:src` — deliberately NOT `nimble build`: in a
      # bare `docker run` (HOME=/root, no persisted choosenim state, unlike
      # `./dev`'s mounted .docker-home) nimble 0.22.2's resolver misses the
      # image nim and downloads a vanilla one that ignores this repo's build
      # config. `nim c` loads both the fetch-deps-generated root nim.cfg (dep
      # --paths) and the per-mainfile src/crisol.nim.cfg (-d:ssl). A dedicated
      # .gate-nimcache (never in actions/cache) keeps the compile clean.
      #
      # Gate: assert the PROPERTY, not a compilation artifact. The earlier
      # `strings ./crisol | grep SSL_connect` proxy was fragile — the OpenSSL
      # FFI wrapper's dynlib symbol name is an unreferenced .rodata string
      # that link-time dead-stripping removes in some environments (it stayed
      # in local ld builds, vanished on the CI runner) even for a genuinely
      # -d:ssl binary (CI compiled openssl.nim, which Nim only does under
      # -d:ssl). Instead, RUN the built binary against an https:// remote-cache
      # tier: a -d:ssl build accepts it (config validates; SEC1 emits the
      # "server operator fully trusted" warning), while a build lacking TLS
      # hits the compile-time capability guard and errors "lacks TLS support
      # (-d:ssl)". Absence of that error is the L1 property, directly tested
      # and immune to link/strip differences.
      - name: Build production binary — confirm -d:ssl is the default
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.gate-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash -c '
              set -euo pipefail
              nim c --path:src -o:crisol src/crisol.nim
              printf "remote-cache \"gate\" {\n  url \"https://example.invalid/cache\"\n}\n" > .gate-https.kdl
              out=$(./crisol list --config .gate-https.kdl 2>&1 || true)
              if grep -qi "lacks TLS support" <<<"$out"; then
                echo "L1 REGRESSION: the produced crisol binary rejects an https:// remote-cache tier -- -d:ssl is no longer the default build-path define (see src/crisol.nim.cfg)" >&2
                echo "$out" >&2
                exit 1
              fi
              echo "OK: crisol binary accepts https:// remote-cache tiers (-d:ssl is the default)"
            '

  timing:
    runs-on: ubuntu-latest
    # R8-D2: typical wall time ~2 min (runs 35491097764/35486328581). 30 is
    # generous on purpose -- a cold nimcache recompiles every file -- but a
    # wedged timing test still cannot hold the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      # Serial by design: the timing/rlimits suite (tests/timing/) is
      # deadline- and scheduling-sensitive and flakes under any concurrent
      # host load, this job included — it never shares a runner with `test`.
      # tests/conformance rides along (rfc-0007 A2a-ii): its TIMING-SENSITIVE
      # cases (shared grace window, shutdown wakeup, timeout-kill grace
      # timing) are CRISOL_TIMING_TESTS-gated in-file and only actually run
      # here — the `test` job's leg quits them out at 0 immediately.
      - name: Run timing suite (serial)
        run: |
          docker run --rm \
            -v "$PWD:/workspace" -w /workspace \
            -e CRISOL_TIMING_TESTS=1 \
            -e CRISOL_TEST_DIRS=tests/timing:tests/conformance \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            ghcr.io/coreyleavitt/nim:2.2.10 bash ci/run-tests.sh

  # rfc-0007 B3 — the leg-first cgroup-v2 delegation canary. `test`/`timing`
  # above run a plain `docker run` (no --privileged): the container's own
  # cgroup is a regular, non-root cgroup handed to it by dockerd with an
  # empty cgroup.subtree_control, so capabilities().cgroupDelegation is
  # honestly false there (asserted by checkTierPins' ci-linux branch) — B3
  # needs a leg where delegation is REALLY present, not asserted from a
  # no-op probe (the #12 lesson).
  #
  # Approach chosen: `docker run --privileged` on the GH-hosted runner, NOT
  # a bare sudo-delegated subtree on the runner host directly. Both were
  # tried empirically (against a real cgroup-v2 host, not just read from
  # docs) before landing here:
  #   - Bare host subtree: the runner's login/job shell already sits deep in
  #     a systemd-managed hierarchy (session/job scope) that it does not own
  #     (cgroup.subtree_control there is root:root, not chown'd to the
  #     runner uid) — every write needs `sudo` per-call, and the shell
  #     process itself is a standing occupant of whatever scope holds it,
  #     which collides with the very constraint below.
  #   - `--privileged` container: dockerd hands the container a writable,
  #     freshly-rooted cgroup-v2 view (0::/) with full delegation once the
  #     no-internal-process topology (next paragraph) is set up inside it —
  #     no per-call sudo, no pre-existing occupants to work around.
  #
  # The topology, and why it's shaped this way (verified empirically, not
  # assumed from docs): cgroup v2's "no internal process constraint" means a
  # cgroup can NEVER hold a resident process at the same time as it enables
  # controllers in its OWN cgroup.subtree_control — attempting either while
  # the other holds fails with EBUSY. Concretely this means the container's
  # entrypoint shell (which starts AT the container's cgroup root) must
  # vacate the root before the root can delegate anything:
  #   1. mkdir a throwaway leaf, move the entrypoint shell into it — root is
  #      now unoccupied.
  #   2. NOW enable +cpu +memory +pids on the (unoccupied) root's
  #      subtree_control.
  #   3. mkdir the real runner leaf (a CHILD of root, i.e. a SIBLING of the
  #      throwaway leaf) and move the shell there. Because root's
  #      subtree_control already carries +memory, the runner leaf gets
  #      real memory.peak/memory.max/cgroup.kill files on itself immediately
  #      — this is the exact shape `probeCgroupV2` (posixcore.nim) now
  #      checks (a SIBLING of the calling process's own cgroup, never a
  #      CHILD of it — a child-of-self leaf can never get the memory
  #      controller, structurally, no matter the environment, since the
  #      calling process's own cgroup can never delegate to its own child
  #      while occupied by that same process; see that proc's comment).
  # Every child process forked afterward (the whole nimble test run) stays
  # in the runner leaf by ordinary cgroup inheritance, so the crisol test
  # binary itself is the process `probeCgroupV2` actually walks.
  #
  # CRISOL_TIER=ci-cgroup pins the acceptance in
  # tests/integration/test_rfc0007_a7_substrate_cli.nim to
  # cgroupDelegation/cgroupKill/memoryPeak all true — an inert probe (or a
  # regressed one) fails HERE, not silently, the first time B3's backend
  # tries to consume it.
  cgroup:
    runs-on: ubuntu-latest
    # R8-D2: typical wall time ~30 min (runs 35491097764/35486328581); the
    # same ~2.5x headroom as the `test` job, which runs the same suite.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored deps (milpa.lock)
        run: bash ci/fetch-deps.sh

      - name: Cache nim compile cache
        uses: actions/cache@v4
        with:
          path: .ci-nimcache
          key: nimcache-${{ runner.os }}-${{ hashFiles('milpa.lock', 'crisol.nimble') }}
          restore-keys: |
            nimcache-${{ runner.os }}-

      - name: Establish real cgroup-v2 delegation and run the test suite inside it
        run: |
          docker run --rm --privileged \
            -v "$PWD:/workspace" -w /workspace \
            -e XDG_CACHE_HOME=/workspace/.ci-nimcache \
            -e CRISOL_TIER=ci-cgroup \
            ghcr.io/coreyleavitt/nim:2.2.10 bash -c '
              set -euo pipefail
              echo "--- before delegation ---"
              cat /proc/self/cgroup
              cat /sys/fs/cgroup/cgroup.controllers

              mkdir -p /sys/fs/cgroup/crisol-init
              echo $$ > /sys/fs/cgroup/crisol-init/cgroup.procs

              echo "+cpu +memory +pids" > /sys/fs/cgroup/cgroup.subtree_control

              mkdir -p /sys/fs/cgroup/crisol-runner
              echo $$ > /sys/fs/cgroup/crisol-runner/cgroup.procs

              echo "--- after delegation ---"
              cat /proc/self/cgroup
              test -f /sys/fs/cgroup/crisol-runner/memory.peak || {
                echo "SETUP FAILED: runner leaf has no memory.peak -- delegation was not actually established" >&2
                exit 1
              }
              test -f /sys/fs/cgroup/crisol-runner/cgroup.kill || {
                echo "SETUP FAILED: runner leaf has no cgroup.kill" >&2
                exit 1
              }
              echo "delegation established: runner leaf has memory.peak and cgroup.kill"

              bash ci/run-tests.sh
            '

  # rfc-0007 A2d — the cross-platform contract spike (N=3 before A2b rebuilds
  # the runner on the contract). No docker here: docker-for-tooling is a
  # Linux pattern (the `test`/`timing` jobs above use a Linux container
  # regardless of runner OS); windows-latest/macos-latest run Nim NATIVELY
  # from the same patched-toolchain artifact channel (ghcr.io/coreyleavitt/
  # nim OCI artifacts, fetched by ci/fetch-nim-toolchain.sh; windows uses
  # the MSVC backend), per this RFC's §1 promise that each
  # backend is "checkable per platform from any host" — the checkABLE part
  # is the `./dev run nim check --os:...` step a contributor runs locally
  # from Linux; these two legs are where it actually EXECUTES.
  windows:
    runs-on: windows-latest
    # R8-D2: typical wall time ~55 min (runs 35491097764/35486328581), the
    # slowest leg by far -- ~40 native `nim r` steps plus the B4b sweep, all
    # MSVC links. Roughly 2.5x that; a hang no longer holds the runner for
    # GitHub's 360-minute default.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash   # ci/fetch-deps.sh needs it; keeps every step's
                       # quoting/globbing uniform (Git Bash ships on
                       # windows-latest runners) instead of mixing in pwsh.
    steps:
      - uses: actions/checkout@v4

      # Patched-toolchain parity with the Linux legs (which run inside
      # ghcr.io/coreyleavitt/nim:2.2.10): this leg previously installed
      # STOCK upstream 2.2.10 via setup-nim-action, silently dropping the
      # backport patch set (incl. the 26017 bigchunk-freelist and 26110
      # memregion allocator fixes) and running the mingw/gcc backend. Now
      # it pulls the native toolchain artifact and compiles with MSVC:
      # cc = vcc is appended to the toolchain's own config so crisol's
      # CHILD nim compiles (the runner spawns nim per entrypoint) inherit
      # it too, not just the top-level suite builds; vccexe.exe ships in
      # the artifact and resolves cl.exe via vswhere on windows-latest.
      - name: Install patched Nim toolchain (MSVC)
        id: toolchain
        run: |
          BIN=$(bash ci/fetch-nim-toolchain.sh 2.2.10-windows-x64 "$RUNNER_TEMP/nimtc" | tail -1)
          CFG="$(dirname "$BIN")/config/nim.cfg"
          printf '\n@if windows:\n  cc = vcc\n@end\n' >> "$CFG"
          # wiring-audit W2: prove the append actually landed where nim will
          # read it. `fetch-nim-toolchain.sh` locates the bin dir with a
          # `find -maxdepth 2 -type d -name bin | head -1` and this caller
          # takes its `tail -1`, so an artifact-layout change could silently
          # append to the wrong path (or create one) and leave this leg on
          # mingw-gcc. The backend itself is asserted by the step below;
          # this catches the mechanical half with a clearer message.
          grep -q '^  cc = vcc$' "$CFG" || {
            echo "W2: 'cc = vcc' did not land in $CFG" >&2; exit 1; }
          echo "$BIN" >> "$GITHUB_PATH"

      # Default success() gate, and the `id` every later step keys on: this
      # step can only run after `toolchain` succeeded, so `steps.sanity.outcome
      # == 'success'` means "a patched nim is on PATH" (R8-D2).
      - name: Toolchain sanity (patched build, vcc backend)
        id: sanity
        run: |
          nim --version
          nim --version 2>&1 | grep -qi "2.2.10" || { echo "wrong nim version" >&2; exit 1; }

      # wiring-audit W2: this leg IS the MSVC leg, and until this step
      # existed nothing proved it. Every MSVC capability in crisol dispatches
      # on RUNTIME facts, never on `defined(vcc)` — ccFamilyOfDriver reads
      # the manifest's driver token, ObjectExtensions accepts both spellings
      # unconditionally, classify keys on the root's probed fold policy. That
      # is deliberate (a gcc-built crisol must read a cl-produced nimcache),
      # and its consequence is that a leg silently reverted to mingw-gcc
      # would take the GNU arm everywhere and pass EVERY test green while
      # proving nothing — including the two files that are the sole CI
      # producers for #21 and #23.
      #
      # Placed here, before `Fetch vendored deps`, so it fails in seconds
      # rather than after twenty-odd steps of misleading green. The test
      # imports only std, so it needs no deps and no --path:src. It also runs
      # again inside the B4b sweep below (same env), which is what puts its
      # CRISOL-CC-BACKEND line into the log assert-subset-honesty.sh reads.
      #
      # R7-L2, corrected by R8-D2: from this step on, a red step does not
      # skip the ones after it ("surface every windows issue per run"), so
      # "fails in seconds" still holds -- this step goes red first -- without
      # silently skipping the rest. But nothing runs on a broken foundation,
      # and nothing runs on a cancelled run:
      #   - this step and Fetch vendored deps: `!cancelled() &&
      #     steps.sanity.outcome == 'success'` -- run after an unrelated red
      #     step, never without a patched nim on PATH;
      #   - every step after the fetch: `!cancelled() && steps.deps.outcome ==
      #     'success'` (the fetch itself only runs on a sane toolchain, so this
      #     implies it too). A failed toolchain install or fetch therefore
      #     fails ONCE, instead of R7-L2's `if: always()` turning it into
      #     thirty-odd `nim: not found` / missing-module failures -- the noise
      #     R7-L2 said it prevented, and did not;
      #   - the one step that needs neither (F16's registry write) carries
      #     `!cancelled()` alone.
      # `!cancelled()`, never `always()`: `cancel-in-progress` (top of file)
      # stops a superseded PR run, and always() kept ~40 MSVC `nim r` steps
      # grinding on after it. GitHub's guidance reserves always() for steps
      # that must run even on cancellation; none of these must.
      - name: "C backend: this leg builds with vcc"
        if: ${{ !cancelled() && steps.sanity.outcome == 'success' }}
        env:
          CRISOL_EXPECT_CC: vcc
        run: nim r --hints:off --warnings:off tests/conformance/test_cc_backend.nim

      - name: Fetch vendored deps (milpa.lock)
        id: deps
        if: ${{ !cancelled() && steps.sanity.outcome == 'success' }}
        run: bash ci/fetch-deps.sh

      # Fast semantic pass first: `nim check` here targets the HOST os
      # (windows-latest IS windows — no --os override needed, unlike the
      # `./dev run nim check --os:windows` cross-check a contributor runs
      # from a Linux checkout). Fails fast with clearer diagnostics before
      # the full compile+link below.
      # NOT the soundness gate: this step deliberately carries neither
      # --warningAsError flag. That gate is ci/source-soundness-gate.sh, run
      # once from the linux `test` job, which cross-targets windows and macosx
      # with `nim check --os:` (R5-2) -- three partial gates would be a worse
      # deal than one that can see all three targets.
      - name: nim check — process.nim on real Windows
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim check --hints:off --path:src src/crisol/process.nim

      # A2d's acceptance for this leg (historical): COMPILES and the smoke test
      # PASSES — spawn, losslessly observed exit code, and a Job-Object-backed
      # kill. Since then RFC-0009 Stage B de-POSIX'd the suite and the B4b step
      # below widened this leg to the full tests/unit:tests/conformance sweep;
      # test_conformance.nim no longer imports std/posix (B3a-ii) and compiles
      # here, but it is the POSIX process-backend conformance suite, so it
      # self-skips `when not defined(posix)` on windows (that backend is proven
      # by the per-file test_windows_* steps in this job). This smoke step is
      # kept as the fast early spawn/kill check ahead of the fuller sweep.
      - name: Compile and run the Windows smoke test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_smoke.nim

      # rfc-0007 D1a — the four load-bearing pieces, each with its own
      # narrowly-scoped conformance file (mirrors the smoke test above, not
      # test_conformance.nim's std/posix-importing full suite): the
      # ekNtStatus producer proof (access-violation fixture), snapshotTree
      # forensics, the completion-port `next` tier, and inherited-handle
      # sink delivery. "Conformance SMOKE green" per the D1a bullet — full
      # windows-suite parity remains RFC-0009's acceptance, not this leg's.
      - name: D1a — ekNtStatus producer proof (access violation)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_ntstatus.nim

      - name: D1a — snapshotTree forensics
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_forensics.nim

      - name: D1a — completion-port next (IOCP)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_iocp.nim

      - name: D1a — inherited handles to sinks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}   # run all D1a checks even if an earlier one failed — surface every windows issue per run
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_sinks.nim

      - name: rfc-0007 D1b — windows cooperative stop / cooperativeUnavailable
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_coopstop.nim

      - name: rfc-0007 D1b — windows Job limits (cpu/address-space)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_limits.nim

      - name: rfc-0007 D1b — windows containment / ppid forensics
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_containment.nim

      - name: rfc-0007 D2a — windows memprobe groupRssBytes + shutdown getter
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_memprobe.nim

      - name: rfc-0007 D2a — windows advisory lock (LockFileEx)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_lock.nim

      - name: rfc-0007 D2a — windows availableMemBytes (GlobalMemoryStatusEx)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_availmem.nim

      - name: rfc-0007 D2a-5 — windows socket timeouts (winsock DWORD-ms)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_httptimeout.nim

      - name: rfc-0007 D2a-4 — windows ioutils (CRT int-fd backend)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_ioutils.nim

      - name: rfc-0007 D2a — crisol CLI compiles on windows
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim c --hints:off --warnings:off --path:src -o:crisol_win_smoke src/crisol.nim

      - name: rfc-0007 D2a-6 — windows CLI liveness (crisol run --json)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_windows_cli_smoke.nim

      - name: A0-spike — import-case manifest observation
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_spike_import_case.nim

      # issue #22 — the two capture-completeness tests, pinned as per-file
      # steps because this leg's suite step sweeps tests/unit:tests/conformance
      # and these live under tests/integration. That placement is not
      # incidental: the defect they cover (streams.readAll stopping at a
      # child's first flush; a separate-stderr pipe never drained) can ONLY
      # fail on Windows — POSIX osproc hands back a buffered FILE* whose fread
      # loops to EOF, so both files pass on the Linux and macOS legs no matter
      # what the code does. Without these steps the fix has no CI producer on
      # the only platform that can regress it.
      #
      # test_issue22_capture: two-burst child through ccprobe.realRun (the
      # dependency probe's own seam) and icbaseline.realIcRun, plus a
      # 256 KB-stderr child that must not wedge the probe.
      # test_issue22_changed_completeness: the user-visible one — a `git`
      # whose diff arrives in two bursts must still yield every changed name
      # to `--changed` selection, and a git whose stderr overruns the pipe
      # buffer must neither wedge nor be truncated; and a `git ls-files`
      # that exits non-zero or does not finish must fail `--changed` closed
      # (exit 3) rather than silently drop untracked files.
      # wiring-audit W9i (code-review ledger, 2026-09-21): every step below
      # that runs a tests/integration/ file individually appends its output
      # into harness.log via `tee -a` (the `shell: bash` default this job
      # sets above already resolves to `bash -eo pipefail {0}`, so a nonzero
      # `nim r` exit still fails the step through the pipe). tests/integration
      # is out of scope for the B4b sweep below (CRISOL_TEST_DIRS:
      # tests/unit:tests/conformance), so without this append a pinned
      # integration file that started silently SKIPPING instead of failing
      # would exit 0 and leave no trace in the only log
      # ci/assert-subset-honesty.sh ever reads -- exactly the CR6/W9i defect
      # class. harness.log does not exist yet at this point in the job;
      # `tee -a` creates it on the first append, same as a fresh file.
      - name: "issue #22 — child-output capture completeness (ccprobe/icbaseline)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue22_capture.nim 2>&1 | tee -a harness.log

      - name: "issue #22 — --changed sees every changed file (gitdiff)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue22_changed_completeness.nim 2>&1 | tee -a harness.log

      # issue #23 — the soundness key's C-toolchain component, pinned as a
      # per-file step for the same reason as #22's above: it lives under
      # tests/integration, which this leg's suite step does not sweep, and it
      # can only fail HERE. On POSIX `cc` and `ldd` both answer, so the
      # fingerprint already named a real toolchain and this file was green
      # before the fix; on Windows neither command exists under any
      # toolchain, so every Windows host folded to the constant
      # `<cc-unavailable>|<ldd-unavailable>` and an MSVC cache entry shared a
      # soundness key with a mingw-gcc one. Without this step the fix has no
      # CI producer on the only platform that can regress it.
      #
      # It drives `ccidentity.cachedToolchainProbe(ctx)` -- the real accessor,
      # real seams -- and asserts both halves of the configured toolchain are
      # identified by content: the compiler through its preprocessor answer,
      # the runtime by the .lib files this toolchain will actually link
      # (Nim+vcc links the CRT statically, so there is no libc DLL and no
      # version string to read).
      # wiring-audit W9i: append into harness.log (see the comment above the
      # issue #22 steps).
      - name: "issue #23 — soundness key identifies this host's C toolchain"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue23_cc_identity.nim 2>&1 | tee -a harness.log

      # Issue #21: the MSVC impact-selection tracer. This file is the ONLY
      # end-to-end producer of the property #21 exists for -- that a
      # {.compile.}d C source's #include'd header is a tracked closure member
      # and drives `--changed` selection -- driven through the real
      # `crisol run` / `crisol closure --json` entry points.
      #
      # It had never run on this leg, and that is precisely why four stacked
      # gcc-isms survived here unnoticed: it lives in tests/integration/, and
      # the bulk sweep step below only covers tests/unit:tests/conformance.
      # Every one of those four failed SILENTLY (an empty closure, a
      # never-matched compile entry, a bogus one-entry header set, a dropped
      # header) rather than erroring, so no other leg or step could have
      # caught them either.
      # wiring-audit W9i: append into harness.log (see the comment above the
      # issue #22 steps).
      - name: "issue #21 — {.compile.}d header closure under MSVC"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue16_headers.nim 2>&1 | tee -a harness.log

      # wiring-audit W9b (code-review ledger, 2026-09-21): the M-driver's
      # single real live-compile integration test (real newMeasureDriver(),
      # real `nim c --compileOnly`, real cc, real linker) had NO producer on
      # this leg at all -- it lives under tests/integration, which this
      # leg's bulk sweep below (CRISOL_TEST_DIRS: tests/unit:tests/
      # conformance) does not reach, and it was never pinned as a per-file
      # step either. Its own nimcache object-file scan was MSVC-blind
      # (`walkFiles(nimcacheDir / "*.o")`, silently zero matches under
      # cl/vccexe, whose objects are `.obj`), so the `check sawObjectFile`
      # would fail loudly the first time this file ran here -- except it
      # never once ran here, so that loud failure was never observed. The
      # scan is now `closure.ObjectExtensions`-aware (both `.o` and `.obj`);
      # this step gives that fix its first real MSVC producer.
      # wiring-audit W9i: append into harness.log (see the comment above the
      # issue #22 steps).
      - name: "compiledriver: a real live compile, cc and link under MSVC"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_compiledriver_real.nim 2>&1 | tee -a harness.log

      # ROUND-2 REVIEW (High): CR4's deadline guard had NO producer on ANY
      # leg. tests/integration/test_tool_capture_deadline.nim appeared nowhere in
      # this file, and it lives under tests/integration/, which this leg's
      # bulk sweep below (CRISOL_TEST_DIRS: tests/unit:tests/conformance)
      # does not reach -- so only the Linux leg's default integration sweep
      # ever ran it. toolexec.nim's deadline drain is genuinely
      # platform-forked: a `when defined(windows)` PeekNamedPipe polling arm
      # vs a POSIX poll(2) arm. The Windows arm -- the platform where a
      # wedged MSVC linker probe (`vccexe ... /link /VERBOSE:LIB`) is the
      # actual hazard CR4 exists to bound -- had therefore never executed
      # once, anywhere. This step is its first producer.
      # wiring-audit W9i: append into harness.log (see the comment above the
      # issue #22 steps).
      - name: "tool capture deadline: a child that never exits is abandoned (Windows, PeekNamedPipe)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_tool_capture_deadline.nim 2>&1 | tee -a harness.log

      # R8-L1: toolrun's presence contract -- "not on PATH -> empty output,
      # ran-and-failed -> non-empty output" -- which ccidentity's R7-S1 refusal
      # rests on. Its own header says it is pinned against the real primitive
      # "on every platform", but it lives under tests/integration/, which this
      # leg's B4b sweep does not reach, so until this step it ran only on the
      # Linux legs. Windows is the platform whose spawn-failure path
      # (CreateProcess, not execvp) R7-S1 actually depends on. Appended into
      # harness.log (wiring-audit W9i) so assert-subset-honesty.sh's
      # MUST-EXECUTE check can see its three [OK] lines.
      - name: "toolrun presence contract: not started vs ran and failed (Windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_probe_presence_contract.nim 2>&1 | tee -a harness.log

      # R9-D1c: the real MSVC identity probe under `CL`. cl reads `CL` and
      # `_CL_` on every compile; the preprocessor probe must identify the
      # configured compiler under a non-empty `CL` (the banner probe it
      # replaced was refused there) and a `CL` value must move the compiler
      # half of the key. The file sets `CL` in-process and restores it. It
      # probes the compiler the global Nim configuration selects (`cc = vcc`
      # on this leg), through vccexe, which finds cl itself -- no Developer
      # Command Prompt environment is needed. assert-subset-honesty.sh
      # REQUIRES its real body on this leg (MUST-EXECUTE).
      - name: "real cl identified under CL, and CL keys the compiler (MSVC)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_real_cl_identity.nim 2>&1 | tee -a harness.log

      # R10-L3: the Windows arms of toolexec's drain failure paths. The R9
      # capture-endings file pins a pipe that fails mid-capture (on Windows,
      # PeekNamedPipe's invalid-handle error) as `reIoError` and a child past
      # the byte cap as `reOverflow`; both arms are `when defined(windows)`
      # code that the Linux legs cannot reach, and the file lives under
      # tests/integration/, which the B4b sweep below does not. Appended
      # into harness.log (wiring-audit W9i) so assert-subset-honesty.sh can
      # see its [OK] lines.
      - name: "tool capture endings: drain error and output cap arms (Windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_tool_capture_endings.nim 2>&1 | tee -a harness.log

      # R10-L4/D2: the same endings at the toolrun.RunProc seam every probe
      # calls, plus the stdin feed (`realRunWithStdinIn`) ccidentity's
      # discovery compile moves onto -- on Windows a handle-stream write and
      # close, not a POSIX fd. Appended into harness.log (W9i).
      - name: "toolrun endings and stdin feed (Windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_toolrun_endings.nim 2>&1 | tee -a harness.log

      # R10-L3: W3 liveness end to end under MSVC. Run 3 sets
      # `CL=/DW3_LIVENESS`; cl reads it on every compile and ccidentity folds
      # it into the compiler digest, so a fresh `crisol run` subprocess must
      # recompile rather than serve the run-1 binary. This leg is the only
      # one with cl, and the file lives under tests/integration/, which the
      # B4b sweep below does not reach. Its GNU-on-Windows arm self-skips
      # with a CRISOL-SKIP-TEST marker; under MSVC it must run its real body.
      # Appended into harness.log (W9i).
      - name: "cc identity liveness: a CL change recompiles end to end (MSVC)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_cc_depgraph_liveness.nim 2>&1 | tee -a harness.log

      # R10-S5/R12-D2: `--changed` against a real git submodule (a gitlink
      # the diff names as a whole, expanded to the names its own diff
      # reports), through runMain. An untracked nested repository is still
      # walked with walkDir, whose Windows arm (FindFirstFile, junction
      # detection) the Linux legs cannot reach, and the submodule's
      # directory links are junctions here. Appended into harness.log (W9i).
      - name: "changed: edits and commits inside a git submodule are seen (windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_changed_submodule.nim 2>&1 | tee -a harness.log

      # R12-D1: a link the diff names (repointed, deleted, replaced, or seen
      # through as a directory) selects exactly the tests whose closure was
      # reached through it, and `--changed` refuses only when `--base` does
      # not resolve to a commit, through runMain against real temp
      # repositories. The directory links are junctions here, which git
      # treats as plain directories; the index-recorded cases hold links as
      # git does without symlink support (mode 120000,
      # `core.symlinks=false`). No skip path. Appended into harness.log (W9i).
      - name: "changed: a link in the diff selects the tests reached through it (windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_changed_symlink.nim 2>&1 | tee -a harness.log

      # R13-S3: a submodule whose .git entry was removed (stranded), at the top
      # level and nested, is still seen by `--changed`: an edit inside it
      # selects its dependent test, while an uninitialised or unchanged
      # submodule contributes nothing. Through runMain against real temp
      # repositories, whose directory walk takes walkDir's Windows arm here.
      # No skip path. Appended into harness.log (W9i).
      - name: "changed: edits inside a submodule whose .git was removed are seen (windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_changed_stranded_submodule.nim 2>&1 | tee -a harness.log

      # Issue #26: a run cut short between recording an entrypoint's closure
      # and promoting its binary (TerminateProcess to the real CLI, or a
      # run-phase spawn failure) must not leave the new depgraph entry beside
      # the old stable binary; the next run recompiles and fails. A previous
      # binary that cannot be retired (the seam, directly and through a real
      # execute(), a directory in its place through the CLI's --json, and a
      # held-open exe here) drops the entry instead. The
      # SIGINT case is POSIX only and runs in the Linux sweep and the macOS
      # step. The two R21-S1 broken-stderr cases run here but pass
      # vacuously (R22-D2): the MSVC CRT never reports a failed stderr
      # write, so nothing raises with or without the guard; they are
      # load-bearing only on the POSIX legs. Appended into harness.log (W9i).
      - name: "#26: a run cut short before promotion never runs the old binary (windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue26_promotion_interrupt.nim 2>&1 | tee -a harness.log

      # A directory link on a Nim import path, repointed after a run, must
      # force a recompile (never a stale compile skip or cached result),
      # through runMain against real temp projects. The link is a junction
      # here (tests/support/dirlink.nim, no privilege needed). The index
      # walk's Windows arm (walkDir's reparse-point detection) is what must
      # see the junction as a link and record it; the Linux legs cannot
      # reach it. No skip path. Appended into harness.log (W9i).
      - name: "cache: a retargeted symlink on an import path recompiles (windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue25_symlink_retarget.nim 2>&1 | tee -a harness.log

      # R7-L6: the toolchainFp producer chain (a real measured run through
      # the self-reexec measure worker, hops 1-7) under MSVC. It lives under
      # tests/integration/, which the B4b sweep below does not reach, so
      # until this step it ran only on Linux. Appended into harness.log
      # (W9i); assert-subset-honesty.sh requires its four [OK] lines.
      - name: "toolchain fingerprint reaches every row of a measured run (MSVC)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_toolchainfp_producer_chain.nim 2>&1 | tee -a harness.log

      # R10-L9: the mingw runtime identity. windows-latest ships MinGW-w64
      # gcc (UCRT) on PATH in C:\mingw64\bin beside MSVC; the file's
      # project nim.cfg says `cc = gcc`, so both the real probe and a real
      # `crisol run` take the mingw arm (`__MINGW32__`: libucrt.a/libmsvcrt.a
      # and the DLLs they bind) that no other leg can reach. Appended into
      # harness.log (W9i); assert-subset-honesty.sh requires both [OK] lines
      # and forbids its no-gcc skip markers.
      - name: "mingw runtime identity: a cc = gcc project beside MSVC"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_mingw_runtime_identity.nim 2>&1 | tee -a harness.log

      # R3-12: a tool whose descendant keeps its output pipe open ends
      # promptly as reIoError, and the whole tree is killed. On Windows the
      # kill is the job-object arm of toolexec, which the Linux legs (process
      # group) cannot reach, and the file lives under tests/integration/,
      # which the B4b sweep below does not. Appended into harness.log (W9i);
      # assert-subset-honesty.sh requires both [OK] lines.
      - name: "tool tree termination: a descendant holding the output is killed (Windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_tool_tree_termination.nim 2>&1 | tee -a harness.log

      # CR18: tools never inherit the CRISOL_CACHE_* credentials, through each
      # tool entry point. The Windows environment is case-insensitive, so a
      # lower-cased credential name must be scrubbed too -- a check only this
      # leg can make. Appended into harness.log (W9i); assert-subset-honesty.sh
      # requires all four [OK] lines.
      - name: "tool environment: cache credentials are scrubbed (Windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_tool_env_scrub.nim 2>&1 | tee -a harness.log

      # R11-L4: an interrupt ends a running bounded tool through the live-tool
      # registry (the job kill a console Ctrl-C reaches). The signal suites in
      # the same file are POSIX-only. Appended into harness.log (W9i);
      # assert-subset-honesty.sh requires both [OK] lines.
      - name: "tool interrupt: a running bounded tool ends at once, job kill (Windows)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_tool_interrupt.nim 2>&1 | tee -a harness.log

      - name: rfc-0009 A1 — fold-probe real-volume runtime evidence
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_fold_probe.nim

      # RFC-0009 A3b-ii (round-3, R3-18.4): the load-bearing E2E test, real
      # probe (no injection) -- hard-asserts the NTFS volume answers
      # fpAsciiLower (both directly and via this run's own RunReport
      # evidence) before proving selection: a real git repo, a committed
      # case-only rename of a transitively-imported dependency, `--changed`
      # selection through the real `buildRunPlan` shared plan phase. This is
      # the windows leg's producer for the NTFS half of the load-bearing
      # property -- a pinned per-file step, not a conformance sweep, so
      # without it the property has no producer here until B4b.
      - name: rfc-0009 A3b-ii — fold-membership selection (real NTFS probe)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          CRISOL_EXPECT_FOLD: fpAsciiLower
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a3bii_fold_selection.nim

      # RFC-0009 A4b (D5): the load-bearing on-disk-case determinism
      # property, cold vs warm -- a real git-free compile through
      # runner.plan/execute (two entrypoints, divergent importer case,
      # one real on-disk dependency). Self-probes this volume's case-
      # sensitivity (no env injection, same convention as the A0-spike
      # step above) -- NTFS is case-insensitive, so this is a real
      # producer here, not a skip. A pinned per-file step, not a
      # conformance sweep, mirroring the A3b-ii step immediately above.
      - name: rfc-0009 A4b — closure member on-disk-case determinism (real NTFS probe)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a4b_determinism.nim

      # RFC-0009 A5c: the cache-portability E2E — a depRoot closure member's
      # cache key must be host-portable (relocating the project tree between
      # two runs still HITS the local cache). Fold-INDEPENDENT (no
      # CRISOL_EXPECT_FOLD, no volume-skip guard) — this is a producer here
      # regardless of NTFS case policy, mirroring the A3b-ii/A4b per-file
      # steps immediately above. It never self-skips: the aliased depRoot is
      # a directory junction here and a symlink elsewhere
      # (tests/support/dirlink.nim), and the test prints which
      # (`RFC9-A5C ALIAS junction|symlink`). assert-subset-honesty.sh
      # requires its real body on every leg.
      - name: rfc-0009 A5c — cache-portability E2E (depRoot member, relocated tree)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_rfc9_a5c_cache_portability.nim

      # RFC-0009 wiring-audit F16 (TIER A unlock attempt): enable Windows'
      # long-path registry key before the suite step below runs
      # test_rfc9_w2_longpath_e2e.nim. Harmless either way — this only
      # widens what Win32 itself permits; it does not by itself make any
      # given process long-path-aware. IF this runner's nim.exe binary
      # manifest also declares longPathAware, this can unlock that test's
      # TIER A (full compile-through proof) instead of its documented TIER
      # B graceful-degradation fallback; empirically (CI run 35315917270,
      # before this step existed) nim.exe's own file opens were not
      # long-path-aware regardless of this OS-level switch, so TIER B is
      # the realistic near-term outcome — but the test's own adaptive tier
      # selection (see its header doc comment) handles either outcome
      # honestly, so this step is pure upside. R7-L2/R8-D2: it runs after an
      # earlier red step like every per-file step above -- before R7-L2 it was
      # one of only two steps in this job with the default success() gate, so
      # any earlier red step silently skipped it AND (through it) the B4b
      # suite + honesty audit below. Its guard is `!cancelled()` alone: a
      # registry write needs neither nim nor the deps. `shell: pwsh` overrides this
      # job's default `bash` (Git Bash cannot run a PowerShell cmdlet):
      # `Set-ItemProperty` is PowerShell-only; pwsh ships on windows-latest
      # runners alongside Git Bash.
      - name: rfc-0009 F16 — enable Windows LongPathsEnabled registry key
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1

      # RFC-0009 B4b — COMPLETION GATE: widen the windows leg's scope from
      # B4a's tests/unit-only bring-up to tests/unit:tests/conformance, still
      # native, still through the SAME honest-exit wrapper the Linux/macOS
      # legs use (ci/run-tests.sh -> nimble test -> per-file `nim r`). This is
      # the first time the general (non-windows-specific) conformance suite
      # compiles AND runs natively here alongside the unit suite: every
      # POSIX-backend test is gated `when defined(posix)` (B1/B2/B3a/B3b/B3c)
      # so it skips BY DESIGN, while the portable majority — including the
      # load-bearing identity conformance tests (A3b-ii, A4b, A5c) — runs for
      # real. Explicitly OUT of scope for this leg (mirroring the macos-latest
      # leg's own long-standing unit+conformance-only scope, below):
      # tests/integration (heavier process-spawning CLI coverage — Linux/
      # macOS only), tests/timing (the dedicated serial timing job covers
      # this), and tests/fixtures (these compile as CHILD PROGRAMS spawned
      # BY tests/integration cases via compileFixture — they are never
      # discovered by the harness's own test_*.nim sweep and never invoked at
      # all when their driving integration test is itself posix-gated).
      #
      # SUBSET-HONESTY (RFC-0009 round-3 R3-19): ci/assert-subset-honesty.sh
      # asserts, BY NAME not count, that the exact expected set of gated files
      # skipped (and no other), and that the three identity conformance tests
      # ran their REAL body, not a self-skip. `${PIPESTATUS[0]}` preserves
      # run-tests.sh's own honest exit code through the `tee` — a suite
      # failure must never be masked by a passing (or even a failing)
      # assertion step layered on top of it. Conversely the audit ALWAYS
      # runs, even on a red suite: errexit is suspended around the two
      # captured commands, both codes are logged, and the step fails if
      # either is nonzero (code-review L3).
      #
      # R7-L2: the in-step half of that promise was hollow at the job level --
      # this step had no `if:`, so ANY earlier red step (one failing #22/#23
      # producer, say) skipped the whole sweep and the audit, and the markers
      # those steps had already `tee -a`d into harness.log were never judged.
      # Now it runs after any unrelated red step (R8-D2's guard: not
      # cancelled, and the deps fetch -- hence the toolchain -- succeeded).
      # It does NOT depend on the F16 step above having
      # succeeded: test_rfc9_w2_longpath_e2e.nim selects its tier at runtime
      # (TIER A if nim.exe can open a >MAX_PATH source, TIER B graceful-
      # degradation otherwise) and both are honest outcomes, so a failed
      # registry write degrades that one test to TIER B rather than
      # invalidating the sweep. Its only real prerequisites are the toolchain
      # install and deps fetch, and those are exactly what its `if:` names:
      # without them there is nothing honest to sweep or audit, and the job is
      # already red at the step that failed.
      - name: rfc-0009 B4b — unit + conformance suite (native, ci/run-tests.sh)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          CRISOL_TEST_DIRS: tests/unit:tests/conformance
          # wiring-audit W2: pinned HERE as well as on the early step above,
          # because this is the only run whose output reaches harness.log —
          # the log assert-subset-honesty.sh audits. Without it the honesty
          # gate's view of this leg would not record which C backend the
          # suite actually built with.
          CRISOL_EXPECT_CC: vcc
          # wiring-audit W9h (code-review ledger, 2026-09-21): pinned HERE
          # for the same reason as CRISOL_EXPECT_CC immediately above — this
          # is the only run whose output reaches harness.log, and
          # test_rfc9_a3bii_fold_selection.nim is swept into it via
          # CRISOL_TEST_DIRS. Without this, the suite falls through to Mode
          # 3 (belt-and-suspenders, unasserted real-probe) instead of Mode 2
          # (real probe, HARD-asserted against fpAsciiLower) — the log the
          # honesty gate reads would record this leg's weaker mode. Same
          # value as the per-file A3b-ii step above: this is the same NTFS
          # volume.
          CRISOL_EXPECT_FOLD: fpAsciiLower
        run: |
          # `shell: bash` runs this body under `bash -eo pipefail`, so a
          # failing suite would abort the step AT the pipeline and the
          # honesty audit below would never run (code-review L3). errexit is
          # suspended across exactly the two commands whose statuses are
          # captured, then restored before the verdict.
          set +e
          # wiring-audit W9i: append (-a), never overwrite -- the per-file
          # tests/integration/ steps above already wrote their own output
          # into harness.log, and this sweep must not discard it.
          bash ci/run-tests.sh 2>&1 | tee -a harness.log
          suite_status=${PIPESTATUS[0]}
          bash ci/assert-subset-honesty.sh harness.log windows
          honesty_status=$?
          set -e
          echo "rfc-0009 B4b: harness suite exit $suite_status, subset-honesty exit $honesty_status"
          if [ "$suite_status" -ne 0 ]; then
            echo "rfc-0009 B4b: harness suite FAILED (exit $suite_status) -- see output above" >&2
          fi
          if [ "$honesty_status" -ne 0 ]; then
            echo "rfc-0009 B4b: subset-honesty assertion FAILED (exit $honesty_status)" >&2
          fi
          # The suite's own code wins when both failed; both are logged above.
          if [ "$suite_status" -ne 0 ]; then exit "$suite_status"; fi
          exit "$honesty_status"

  macos:
    runs-on: macos-latest
    # R8-D2: typical wall time ~10 min (runs 35491097764/35486328581); 60
    # leaves ample headroom for a slow runner or a cold nimcache while still
    # bounding a hang well below GitHub's 360-minute default.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash   # REQUIRED, not cosmetic: GitHub's implicit default on
                      # non-Windows is `bash -e {0}` WITHOUT pipefail, while an
                      # explicit `shell: bash` resolves to
                      # `bash --noprofile --norc -eo pipefail {0}`. This leg has
                      # per-file steps that pipe into `tee -a harness.log`
                      # (wiring-audit W9i), and without pipefail such a step
                      # returns TEE's exit code -- so a failing `nim r` would
                      # report success. The windows leg already sets this
                      # (see its `defaults:`); found by the code review
                      # 2026-09-21 when W9i's `tee -a` was added here.
    steps:
      - uses: actions/checkout@v4

      # Patched-toolchain parity with the Linux legs -- see the windows
      # leg's comment; same artifact channel, arm64 payload (macos-latest
      # runners are Apple Silicon), clang backend as before.
      - name: Install patched Nim toolchain
        id: toolchain
        run: |
          BIN=$(bash ci/fetch-nim-toolchain.sh 2.2.10-macos-arm64 "$RUNNER_TEMP/nimtc" | tail -1)
          echo "$BIN" >> "$GITHUB_PATH"

      # Default success() gate: runs only once the toolchain installed, so
      # `steps.deps.outcome == 'success'` -- the guard every step after the
      # nim check keys on -- means "patched nim on PATH AND deps present"
      # (R8-D2).
      - name: Fetch vendored deps (milpa.lock)
        id: deps
        run: bash ci/fetch-deps.sh

      # NOT the soundness gate: this step deliberately carries neither
      # --warningAsError flag. That gate is ci/source-soundness-gate.sh, run
      # once from the linux `test` job, which cross-targets windows and macosx
      # with `nim check --os:` (R5-2) -- three partial gates would be a worse
      # deal than one that can see all three targets.
      - name: nim check — process.nim on real macOS
        run: nim check --hints:off --path:src src/crisol/process.nim

      # Cheap pre-check: a suite-wide import mistake fails here before the
      # slower full compile+run below pays the per-file `nim r` cost.
      #
      # R7-L2, corrected by R8-D2: this and every step below carry
      # `if: ${{ !cancelled() && steps.deps.outcome == 'success' }}`, as on
      # the windows leg (see its comment above the "C backend" step). They are
      # independent verdicts; before R7-L2, a red pre-check or a red CR2
      # producer skipped the suite AND the subset-honesty audit that judges
      # the markers CR2 had already `tee -a`d into harness.log. They run after
      # an unrelated red step, but not on a cancelled run (R7-L2's always()
      # did), and not without a toolchain and deps -- a failed install or
      # fetch fails once rather than as a `nim: not found` per step. The
      # pre-check is still the fastest signal of an import mistake -- it is
      # just no longer a gate that hides the rest.
      - name: Conformance suite — import purity (fast pre-check)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/conformance/test_conformance_import_purity.nim

      # code-review CR2 (2026-09-21): the gcc/clang arm's end-to-end
      # producer for the W1 case-resolution fix (closure.nim:1632's
      # `csReported` arm). Pinned as a per-file step for the same reason as
      # #21/#22/#23's tests on the windows leg immediately below (ci.yml):
      # it lives under tests/integration/, which this leg's bulk sweep
      # (CRISOL_TEST_DIRS: tests/unit:tests/conformance, in the step below)
      # does not cover.
      #
      # The file's original fixture (`AddMixed.h`) spells its `#include`
      # directive with the SAME case as the on-disk file, so it only ever
      # exercised cl's systemic `/sourceDependencies` lowercasing — under
      # gcc/clang, whose `-M` echoes the directive's LITERAL spelling
      # verbatim, that fixture produces no mismatch at all. This leg's APFS
      # volume (case-insensitive) is the only CI producer that can trigger
      # the gcc/clang arm, so the file's new self-probing "CR2" suite
      # (native/GccCase.h on disk, `#include "gcccase.h"` in the source)
      # runs its real body here; it self-skips harmlessly everywhere else
      # this file already runs (the windows leg, and the Linux `test` job's
      # unconditional tests/integration/ sweep on genuinely case-sensitive
      # ext4).
      # wiring-audit W9i (code-review ledger, 2026-09-21): append this pinned
      # per-file step's output into harness.log -- the log
      # ci/assert-subset-honesty.sh actually reads. This file lives under
      # tests/integration/, which the "Run unit + conformance suites" sweep
      # below (CRISOL_TEST_DIRS: tests/unit:tests/conformance) never covers,
      # so without this append the CR2-followup per-test skip could go
      # silent with no producer catching it. harness.log does not exist yet
      # at this point in the job; `tee -a` creates it on the first append.
      - name: "header closure: a mis-cased gcc/clang #include resolves to the real case (macOS)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue16_headers.nim 2>&1 | tee -a harness.log

      # R8-L1: the two round-7/round-8 integration files that make a
      # per-platform claim, pinned here for the same reason as the
      # header-closure step above (tests/integration/ is outside this leg's
      # sweep) and appended into
      # harness.log (wiring-audit W9i) for the honesty audit:
      #   - test_probe_presence_contract.nim says it is pinned against the
      #     real primitive "on every platform"; until this step it ran only
      #     on Linux. Darwin's posix_spawn/execvp failure path is a platform
      #     fact of its own. Its three [OK] lines are MUST-EXECUTE here.
      #   - test_real_cl_identity.nim has no MSVC to drive on this leg, so
      #     both of its tests self-skip with CRISOL-SKIP-TEST markers. That
      #     skip is PINNED in this leg's expected set, so the day it stops
      #     firing (or a new one appears) the audit notices; the real body is
      #     the windows leg's to run, and required there.
      - name: "toolrun presence contract: not started vs ran and failed (macOS)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_probe_presence_contract.nim 2>&1 | tee -a harness.log

      - name: "real cl identity: expected self-skip, no MSVC (macOS)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_real_cl_identity.nim 2>&1 | tee -a harness.log

      # R7-L6: the toolchainFp producer chain on Darwin (the measure worker's
      # self-reexec, and the default-probe case against this host's real
      # clang/libSystem identity). tests/integration/ is outside this leg's
      # sweep; appended into harness.log (W9i) so assert-subset-honesty.sh
      # can require its four [OK] lines.
      - name: "toolchain fingerprint reaches every row of a measured run (macOS)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_toolchainfp_producer_chain.nim 2>&1 | tee -a harness.log

      # Issue #26 (R17-L1): a run cut short between recording an entrypoint's
      # closure and promoting its binary (SIGINT and SIGKILL to the real CLI,
      # or a run-phase spawn failure) must not leave the new depgraph entry
      # beside the old stable binary, and a previous binary that cannot be
      # retired drops the entry instead (directly, through a real
      # execute(), and through the CLI's --json). tests/integration/ is
      # outside this leg's sweep; appended into harness.log (W9i) so
      # assert-subset-honesty.sh can require its [OK] lines on Darwin.
      # The held-open-binary case is Windows only.
      - name: "#26: a run cut short before promotion never runs the old binary (macOS)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue26_promotion_interrupt.nim 2>&1 | tee -a harness.log

      # Issue #25 (R18-L1): a directory link on a Nim import path, repointed
      # after a run, must force a recompile (never a stale compile skip or
      # cached result), and the index walk must record the link, through
      # runMain against real temp projects. The link is a symlink here
      # (tests/support/dirlink.nim). tests/integration/ is outside this leg's
      # sweep; appended into harness.log (W9i) so assert-subset-honesty.sh
      # can require all ten [OK] lines on Darwin. No skip path.
      - name: "cache: a retargeted symlink on an import path recompiles (macOS)"
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: nim r --hints:off --warnings:off --path:src tests/integration/test_issue25_symlink_retarget.nim 2>&1 | tee -a harness.log

      # rfc-0007 C1b: the ladder's `macosx` arm now maps to process/darwin —
      # kqueue EVFILT_PROC event-driven `next` + libproc process-table
      # forensics, not the poll(2)/`/proc`-shaped fallback C1a proved this
      # leg on. This proves the FULL unit + conformance suites, not just an
      # import-purity/single-file spot check, live on Darwin's real backend.
      # Same honest-exit wrapper the Linux legs use (`ci/run-tests.sh` ->
      # `nimble test`, see that script's header for why the wrapper exists)
      # — no docker here, windows/macos run Nim natively (A2d).
      # CRISOL_TIER=macos tells test_process_capabilities.nim's tier-pinned
      # acceptance suite which tier's honest capability values to assert
      # (subreaper/pidfd/cgroupDelegation false, kqueue/flock/wait4Rusage
      # true — kqueue real since C1b, the rest real POSIX on Darwin).
      #
      # tests/integration is deliberately excluded (CRISOL_TEST_DIRS pins
      # unit+conformance only) — heavier process-spawning integration
      # coverage on Darwin is out of scope for this slice. Conformance's
      # own TIMING-SENSITIVE cases stay inert here: they self-gate on
      # CRISOL_TIMING_TESTS (unset in this step), same convention as every
      # other leg — the step below turns them on for this leg specifically.
      # RFC-0009 B4b — SUBSET-HONESTY covers this leg too (not just windows):
      # ci/assert-subset-honesty.sh asserts, BY NAME, that nothing in the
      # B2/B3b gated set skips here (macOS/Darwin IS posix, so every
      # `when defined(posix)` gate takes its real branch -- the expected-skip
      # set for "macos" is empty) and that the three identity conformance
      # tests (A3b-ii, A4b, A5c) ran their real body. Same PIPESTATUS +
      # always-audit discipline as the windows leg: run-tests.sh's own
      # honest exit code must never be masked by `tee` or by the assertion
      # step, and a red suite must never skip the audit (code-review L3).
      - name: Run unit + conformance suites (kqueue/libproc backend)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          CRISOL_TIER: macos
          CRISOL_TEST_DIRS: tests/unit:tests/conformance
          # R6-S5: test_cc_backend.nim (swept in above) hard-asserts the C
          # backend this leg built with. Nim's own config selects clang on
          # macosx; assert-subset-honesty.sh requires
          # "CRISOL-CC-BACKEND: clang" in this run's output.
          CRISOL_EXPECT_CC: clang
          # RFC-0009 A3b-ii (round-3, R3-18.4): hard-asserts the real probe
          # on this leg's APFS volume before proving fold-membership
          # selection live (test_rfc9_a3bii_fold_selection.nim, swept in via
          # CRISOL_TEST_DIRS above) -- a leg mis-pinned to the wrong policy
          # fails loudly instead of silently halving the "proven on two
          # case-insensitive legs" claim.
          #
          # RFC-0009 A4b (D5): test_rfc9_a4b_determinism.nim (also under
          # tests/conformance/) is swept in here the SAME way -- it
          # self-probes this volume's case-sensitivity (no env needed) and
          # is a real producer on APFS, mirroring how it gets a dedicated
          # per-file step on the windows job (which runs conformance files
          # individually rather than via CRISOL_TEST_DIRS sweep).
          CRISOL_EXPECT_FOLD: fpAsciiLower
        run: |
          # `shell: bash` runs this body under `bash -eo pipefail`, so a
          # failing suite would abort the step AT the pipeline and the
          # honesty audit below would never run (code-review L3). errexit is
          # suspended across exactly the two commands whose statuses are
          # captured, then restored before the verdict.
          set +e
          # wiring-audit W9i: append (-a), never overwrite -- the CR2
          # per-file tests/integration/ step above already wrote its own
          # output into harness.log, and this sweep must not discard it.
          bash ci/run-tests.sh 2>&1 | tee -a harness.log
          suite_status=${PIPESTATUS[0]}
          bash ci/assert-subset-honesty.sh harness.log macos
          honesty_status=$?
          set -e
          echo "rfc-0009 B4b: harness suite exit $suite_status, subset-honesty exit $honesty_status"
          if [ "$suite_status" -ne 0 ]; then
            echo "rfc-0009 B4b: harness suite FAILED (exit $suite_status) -- see output above" >&2
          fi
          if [ "$honesty_status" -ne 0 ]; then
            echo "rfc-0009 B4b: subset-honesty assertion FAILED (exit $honesty_status)" >&2
          fi
          # The suite's own code wins when both failed; both are logged above.
          if [ "$suite_status" -ne 0 ]; then exit "$suite_status"; fi
          exit "$honesty_status"

      # rfc-0007 C1b: tests/conformance's TIMING-SENSITIVE cases (self-gated
      # on CRISOL_TIMING_TESTS, unset in the step above) include this
      # slice's kqueue latency proof (test_conformance_timing.nim's C1b
      # suite) alongside the existing B2 Linux-mirrored case — the ONLY leg
      # where the C1b suite actually compiles and runs (`when
      # defined(macosx):`-gated). tests/timing/ itself is NOT included here
      # (unlike the Linux `timing` job): several of its files exercise
      # Linux-only subreaper mechanism this leg's Supervisor never enables
      # (caps.subreaper is honestly false on Darwin) — out of scope for this
      # slice, not a gap this step is meant to cover.
      - name: Run conformance suite with timing enabled (kqueue latency proof)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          CRISOL_TIER: macos
          CRISOL_TIMING_TESTS: 1
          CRISOL_TEST_DIRS: tests/conformance
        run: bash ci/run-tests.sh
