# rfc-0007 D1a: this fixture must let a genuine hardware access violation
# propagate UNCAUGHT so the OS terminates the process with
# STATUS_ACCESS_VIOLATION (NTSTATUS 0xC0000005) as its exit code — the
# ekNtStatus producer proof. Nim installs a default SIGSEGV handler, and the
# Windows CRT maps a hardware AV (0xC0000005) to SIGSEGV, so WITHOUT this the
# handler catches the fault and quits with an ordinary Nim exit code
# (ekExited) instead. `noSignalHandler` suppresses that installation so the
# structured exception reaches the OS untouched. Scoped to THIS fixture via
# the `<module>.cfg` name — never the shared tests/fixtures nim.cfg.
--define:noSignalHandler
